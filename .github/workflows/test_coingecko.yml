
name: Test CoinGecko API

on:
  workflow_dispatch:

jobs:
  test-coingecko:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: pip install requests

      - name: Probar historico de Solana
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import requests
          from datetime import datetime, timezone

          print("=== Diagnostico CoinGecko ===")

          key = os.getenv("COINGECKO_API_KEY")
          if not key:
              raise RuntimeError("COINGECKO_API_KEY no configurada")

          url = "https://api.coingecko.com/api/v3/coins/solana/market_chart"

          response = requests.get(
              url,
              headers={"x-cg-demo-api-key": key},
              params={
                  "vs_currency": "usd",
                  "days": 14,
                  "interval": "daily"
              },
              timeout=30
          )

          print("HTTP:", response.status_code)
          response.raise_for_status()

          data = response.json()
          prices = data.get("prices", [])

          print("Precios recibidos:", len(prices))

          if not prices:
              raise RuntimeError("CoinGecko no devolvio precios")

          last = prices[-1]
          last_date = datetime.fromtimestamp(
              last[0] / 1000, tz=timezone.utc
          )

          print("Ultima fecha:", last_date)
          print("Ultimo precio USD:", last[1])

          age = (datetime.now(timezone.utc) - last_date).total_seconds() / 3600
          print("Antiguedad en horas:", round(age, 2))

          if age > 48:
              raise RuntimeError("Historico desactualizado")

          print("RESULTADO: CoinGecko funciona desde GitHub Actions")
          PY
