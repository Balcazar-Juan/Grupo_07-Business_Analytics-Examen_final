name: Crypto Analytics - Data Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo de ejecucion"
        required: true
        default: "regular"
        type: choice
        options:
          - regular
          - daily
          - train
  schedule:
    # Lima (UTC-5): 00:00, 06:00, 12:00, 18:00 -> mercado/noticias
    - cron: "0 5 * * *"
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
    # Domingo 00:30 Lima -> reentrenamiento + forecast
    - cron: "30 5 * * 0"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      COINSTATS_API_KEY: ${{ secrets.COINSTATS_API_KEY }}
      MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: "gemini-3.5-flash-lite"
      AI_HORIZON_DAYS: "30"
      AI_MAX_PER_RUN: "20"
      TOP_N: "20"
      HISTORY_DAYS: "1826"
      FORECAST_DAYS: "365"
      MODEL_MIN_ROWS: "365"
      INCREMENTAL_HISTORY_DAYS: "14"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt

      - name: Weekly model refresh
        if: github.event_name == 'schedule' && github.event.schedule == '30 5 * * 0'
        run: python scripts/refresh.py --train

      - name: Daily historical refresh
        if: github.event_name == 'schedule' && github.event.schedule == '0 5 * * *'
        run: python scripts/refresh.py --daily

      - name: Intraday market/news refresh
        if: github.event_name == 'schedule' && github.event.schedule != '0 5 * * *' && github.event.schedule != '30 5 * * 0'
        run: python scripts/refresh.py

      - name: Manual regular
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'regular'
        run: python scripts/refresh.py

      - name: Manual daily
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'daily'
        run: python scripts/refresh.py --daily

      - name: Manual train
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'train'
        run: python scripts/refresh.py --train
